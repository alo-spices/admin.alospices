<h2 class="dialog-title">
  Confirm Deletion
</h2>

<div mat-dialog-content class="dialog-content">
  Are you sure you want to delete this item?
</div>

<div mat-dialog-actions class="button-group">

  <button
    mat-button
    [mat-dialog-close]="false"
    class="btn-back">
    CANCEL
  </button>

  <button
    mat-raised-button
    [mat-dialog-close]="true"
    class="btn-create">
    DELETE
  </button>

</div>
