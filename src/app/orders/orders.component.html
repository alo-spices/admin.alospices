<div class="category-container">

    <!-- Top Row -->
    <div class="top-row">

        <!-- Title Section -->
        <div class="title-section">
            <h2>Orders List</h2>
            <p>Manage all categories here</p>
        </div>
    </div>

    <!-- Search Row -->
    <div class="search-row">
        <mat-form-field appearance="outline" class="w-100">
            <mat-label>Search Category</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Enter category name">
        </mat-form-field>
    </div>

    <!-- Table Row -->
    <div class="table-row">

        <!-- <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8"> -->
        <table mat-table [dataSource]="dataSource" matSort>
            <!-- S.No -->
            <ng-container matColumnDef="sno">
                <th mat-header-cell *matHeaderCellDef>S.No</th>
                <td mat-cell *matCellDef="let element; let i = index">
                    {{ i + 1 }}
                </td>
            </ng-container>

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                    Category Name
                </th>
                <td mat-cell *matCellDef="let element">
                    {{ element.name }}
                </td>
            </ng-container>

            <!-- Image -->
            <ng-container matColumnDef="image">
                <th mat-header-cell *matHeaderCellDef>Image</th>
                <td mat-cell *matCellDef="let element">
                    <img [src]="element.image" alt="category-image" width="60" height="60">
                </td>
            </ng-container>

            <!-- Status -->
            <ng-container matColumnDef="isActive">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.isActive ? 'Active' : 'Inactive' }}
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let element">
                    <div class="action-buttons">
                        <!-- View -->
                        <button mat-icon-button class="view-btn" (click)="viewCategory(element)">
                            <i class="fa fa-eye" aria-hidden="true"></i> </button>

                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons>
        </mat-paginator>

    </div>

</div>
