<div class="category-container">

  <!-- Header -->
  <div class="top-row">

    <div class="title-section">
      <h2>Category Management</h2>
      <p>Manage all categories here</p>
    </div>

    <div class="button-section">
      <button routerLink="/admin/create-category">
        <i class="fa fa-plus me-2"></i>
        Add Category
      </button>
    </div>

  </div>

  <!-- Search -->
  <div class="search-row">

    <mat-form-field appearance="outline" class="w-100">

      <mat-label>Search Category</mat-label>

      <input
        matInput
        placeholder="Search by Category Name / Code"
        (keyup)="applyFilter($event)">

    </mat-form-field>

  </div>

  <!-- Table -->

  <div class="table-row">

    <table
      mat-table
      [dataSource]="dataSource"
      matSort>

      <!-- S.No -->

      <ng-container matColumnDef="sno">

        <th mat-header-cell *matHeaderCellDef>

          S.No

        </th>

        <td mat-cell *matCellDef="let element; let i=index">

          {{ i + 1 }}

        </td>

      </ng-container>

      <!-- Category Name -->

      <ng-container matColumnDef="name">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header>

          Category

        </th>

        <td mat-cell *matCellDef="let element">

          <div class="category-info">

            <h6>

              {{element.categoryName}}

            </h6>

            <small>

              {{element.categoryCode}}

            </small>

          </div>

        </td>

      </ng-container>

      <!-- Image -->

      <ng-container matColumnDef="image">

        <th mat-header-cell *matHeaderCellDef>

          Image

        </th>

        <td mat-cell *matCellDef="let element">

          <img
            [src]="element.image || 'assets/images/no-image.png'"
            class="category-image">

        </td>

      </ng-container>

      <!-- Status -->

      <ng-container matColumnDef="isActive">

        <th mat-header-cell *matHeaderCellDef>

          Status

        </th>

        <td mat-cell *matCellDef="let element">

          <span
            class="status-badge"
            [ngClass]="element.status=='Active' ? 'active' : 'inactive'">

            {{element.status}}

          </span>

        </td>

      </ng-container>

      <!-- Actions -->

      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>

          Actions

        </th>

        <td mat-cell *matCellDef="let element">

          <div class="action-buttons">

            <!-- View -->

            <button
              mat-icon-button
              class="view-btn"
              (click)="viewCategory(element)">

              <i class="fa fa-eye"></i>

            </button>

            <!-- Edit -->

            <button
              mat-icon-button
              class="edit-btn"
              (click)="editCategory(element)">

              <i class="fa fa-pencil"></i>

            </button>

            <!-- Delete (Soft Delete) -->

            <button
              mat-icon-button
              class="delete-btn"
              (click)="deleteCategory(element)">

              <i class="fa fa-trash"></i>

            </button>

          </div>

        </td>

      </ng-container>

      <!-- Header -->

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <!-- Rows -->

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;">
      </tr>

      <!-- No Data -->

      <tr
        class="mat-row"
        *matNoDataRow>

        <td
          class="mat-cell text-center"
          colspan="5">

          No Categories Found

        </td>

      </tr>

    </table>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5,10,20,50]"
      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
