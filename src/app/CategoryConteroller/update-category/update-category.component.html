<div class="category-container">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="title-section">
          <h2>Update Category</h2>
          <p>Modify category details with a clean and structured layout.</p>
        </div>
      </div>

      <div class="col-md-12">
        <div class="category-card">
          <form [formGroup]="categoryForm" (ngSubmit)="onUpdate()">
            <div class="category-grid">
              <div class="form-panel">
                

                <div class="fields-grid">
                  <div class="form-group full">
                    <label>Category Name</label>
                    <input type="text" formControlName="categoryName" placeholder="Enter category name">
                  </div>

                  <div class="form-group">
                    <label>Category Code</label>
                    <input type="text" formControlName="categoryCode" placeholder="Enter category code">
                  </div>

                  <div class="form-group">
                    <label>Brand</label>
                    <select formControlName="brand">
                      <option value="">Select Brand</option>
                      <option *ngFor="let item of brandList" [value]="item._id">
                        {{ item.brandName }}
                      </option>
                    </select>
                  </div>

                  <div class="form-group full">
                    <label>Description</label>
                    <textarea rows="4" formControlName="description" placeholder="Enter description"></textarea>
                  </div>

                  <!-- <div class="form-group">
                    <label>Display Order</label>
                    <input type="number" formControlName="displayOrder" placeholder="Enter display order">
                  </div> -->

                  <div class="form-group">
                    <label>Status</label>
                    <select formControlName="status">
                      <option value="Active">Active</option>
                      <option value="Inactive">Inactive</option>
                    </select>
                  </div>

                  <div class="form-group full upload-box">
                    <label>Category Image</label>
                    <input type="file" (change)="onFileChange($event)">
                  </div>
                </div>
              </div>

              <div class="preview-panel">
                <div class="section-head">
                  <span class="section-badge">Preview</span>
                  <h3>Image View</h3>
                </div>

                <div class="preview-box">
                  <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview">
                  <div *ngIf="!imagePreview" class="preview-empty">
                    <i class="fa fa-image"></i>
                    <p>No Image Selected</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="button-group">
              <button type="button" class="btn-back" (click)="goBack()">Back</button>
              <button type="submit" class="btn-create">Update Category</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
