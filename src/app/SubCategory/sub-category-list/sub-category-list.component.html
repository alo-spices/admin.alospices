<div class="category-container">

  <!-- Top Row -->
  <div class="top-row">

    <div class="title-section">
      <h2>SubCategory Management</h2>
      <p>Manage all subcategories here</p>
    </div>

    <div class="button-section">
      <button routerLink="/admin/create-subcategory">
        Add SubCategory
      </button>
    </div>

  </div>

  <!-- Search -->
  <div class="search-row">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Search SubCategory</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Enter subcategory name">
    </mat-form-field>
  </div>

  <!-- Table -->
  <div class="table-row">

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

      <!-- S.No -->
      <ng-container matColumnDef="sno">
        <th mat-header-cell *matHeaderCellDef>S.No</th>
        <td mat-cell *matCellDef="let element; let i = index">
          {{ i + 1 }}
        </td>
      </ng-container>

      <!-- SubCategory Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          SubCategory Name
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element.name }}
        </td>
      </ng-container>

      <!-- Category Name (🔥 populate use) -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>
          Category
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element.category?.name }}
        </td>
      </ng-container>

      <!-- Image -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Image</th>
        <td mat-cell *matCellDef="let element">
          <img
            [src]="element.image"
            width="60"
            height="60"
            style="border-radius:8px;">
        </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          {{ element.isActive ? 'Active' : 'Inactive' }}
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let element">
          <div class="action-buttons">

            <!-- View -->
            <button mat-icon-button class="view-btn"
              (click)="viewSubCategory(element)">
              <i class="fa fa-eye"></i>
            </button>

            <!-- Edit -->
            <button mat-icon-button class="edit-btn"
              (click)="editSubCategory(element)">
              <i class="fa fa-pencil"></i>
            </button>

            <!-- Delete -->
            <button mat-icon-button class="delete-btn"
              (click)="deleteSubCategory(element)">
              <i class="fa fa-trash"></i>
            </button>

          </div>
        </td>
      </ng-container>

      <!-- Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 20, 50]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
