<div class="product-container">

    <!-- Header -->
    <div class="top-row">

        <div class="title-section">

            <h2>
                <i class="fas fa-edit me-2"></i>
                Update Product
            </h2>

            <p>
                Update product details and variants
            </p>

        </div>

        <div class="button-section">

            <button type="button" routerLink="/admin/product">
                <i class="fas fa-arrow-left me-2"></i>Back
            </button>

        </div>

    </div>

    <form [formGroup]="productForm" (ngSubmit)="updateProduct()">

        <!-- ================= Product Information ================= -->

        <div class="card">

            <div class="card-header">

                <i class="fas fa-info-circle me-2"></i>

                Product Information

            </div>

            <div class="card-body">

                <div class="row g-3">

                    <!-- Product Name -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-tag me-2"></i>

                            Product Name

                        </label>

                        <input type="text" class="form-control" formControlName="productName">

                    </div>

                    <!-- Product Code -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-qrcode me-2"></i>

                            Product Code

                        </label>

                        <input type="text" class="form-control" formControlName="productCode">

                    </div>

                    <!-- Brand -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-building me-2"></i>

                            Brand

                        </label>

                        <select class="form-select" formControlName="brand">

                            <option value="">

                                Select Brand

                            </option>

                            <option *ngFor="let brand of brandList" [value]="brand._id">

                                {{brand.brandName}}

                            </option>

                        </select>

                    </div>

                    <!-- Category -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-list me-2"></i>

                            Category

                        </label>

                        <select class="form-select" formControlName="category">

                            <option value="">

                                Select Category

                            </option>

                            <option *ngFor="let category of categoryList" [value]="category._id">

                                {{category.categoryName}}

                            </option>

                        </select>

                    </div>

                    <!-- HSN -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-barcode me-2"></i>

                            HSN Code

                        </label>

                        <input type="text" class="form-control" formControlName="hsnCode">

                    </div>

                    <!-- GST -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-percent me-2"></i>

                            GST %

                        </label>

                        <input type="number" class="form-control" formControlName="gstPercentage">

                    </div>

                    <!-- Product Type -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-layer-group me-2"></i>

                            Product Type

                        </label>

                        <select class="form-select" formControlName="productType">

                            <option value="Regular">

                                Regular

                            </option>

                            <option value="NewLaunch">

                                New Launch

                            </option>

                        </select>

                    </div>

                    <!-- Display Order -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-sort-numeric-up me-2"></i>

                            Display Order

                        </label>

                        <input type="number" class="form-control" formControlName="displayOrder">

                    </div>

                    <!-- Featured -->

                    <div class="col-lg-4 col-md-6">

                        <label>

                            <i class="fas fa-star me-2"></i>

                            Featured Product

                        </label>

                        <div class="checkbox-wrap">

                            <input type="checkbox" formControlName="featuredProduct">

                            <span>

                                Mark as Featured

                            </span>

                        </div>

                    </div>

                    <!-- Short Description -->

                    <div class="col-lg-6">

                        <label>

                            <i class="fas fa-align-left me-2"></i>

                            Short Description

                        </label>

                        <textarea rows="3" class="form-control" formControlName="shortDescription">

            </textarea>

                    </div>

                    <!-- Description -->

                    <div class="col-lg-6">

                        <label>

                            <i class="fas fa-file-alt me-2"></i>

                            Description

                        </label>

                        <textarea rows="3" class="form-control" formControlName="description">

            </textarea>

                    </div>

                </div>

            </div>

        </div>
        <!-- ================= Product Variants ================= -->

        <!-- ================= Product Variants ================= -->

        <div class="card mt-4">

            <div class="card-header">

                <i class="fas fa-boxes me-2"></i>

                Product Variants

            </div>

            <div class="card-body" formArrayName="variants">

                <div class="variant-box" *ngFor="let item of variants.controls; let i=index" [formGroupName]="i">

                    <!-- Variant Header -->

                    <div class="variant-header">

                        <h5>

                            <i class="fas fa-cube me-2"></i>

                            Variant {{i + 1}}

                        </h5>

                        <div class="d-flex gap-2">

                            <button type="button" class="btn btn-success btn-sm" (click)="addVariant()">

                                <i class="fas fa-plus me-1"></i>

                                Add

                            </button>

                            <button type="button" class="btn btn-danger btn-sm" *ngIf="i !== 0"
                                (click)="removeVariant(i)">

                                <i class="fas fa-trash-alt me-1"></i>

                                Remove

                            </button>

                        </div>

                    </div>

                    <!-- Variant Fields -->

                    <div class="row g-3">

                        <!-- Pack Size -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-box me-2"></i>

                                Pack Size

                            </label>

                            <input class="form-control" formControlName="packSize">

                        </div>

                        <!-- SKU -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-barcode me-2"></i>

                                SKU Code

                            </label>

                            <input class="form-control" formControlName="skuCode">

                        </div>

                        <!-- Stock -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-cubes me-2"></i>

                                Stock

                            </label>

                            <input type="number" class="form-control" formControlName="stock">

                        </div>

                        <!-- MRP -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-rupee-sign me-2"></i>

                                MRP

                            </label>

                            <input type="number" class="form-control" formControlName="mrp">

                        </div>

                        <!-- GST -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-percent me-2"></i>

                                GST %

                            </label>

                            <input type="number" class="form-control" formControlName="gstPercentage">

                        </div>

                        <!-- Weight -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-weight-hanging me-2"></i>

                                Weight (Grams)

                            </label>

                            <input type="number" class="form-control" formControlName="weightInGrams">

                        </div>

                        <!-- Image -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-image me-2"></i>

                                Product Image

                            </label>

                            <input type="file" class="form-control" (change)="onVariantImage($event,i)">

                            <div class="mt-2" *ngIf="variantImagePreview[i]">

                                <img [src]="variantImagePreview[i]" class="preview-img">

                            </div>

                        </div>

                        <!-- Gallery -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-images me-2"></i>

                                Gallery Images

                            </label>

                            <input type="file" multiple class="form-control" (change)="onVariantGallery($event,i)">

                            <div class="gallery-preview mt-2">

                                <img *ngFor="let img of variantGalleryPreview[i]" [src]="img" class="gallery-img">

                            </div>

                        </div>

                        <!-- Status -->

                        <div class="col-lg-4 col-md-6">

                            <label>

                                <i class="fas fa-toggle-on me-2"></i>

                                Status

                            </label>

                            <select class="form-select" formControlName="status">

                                <option value="Active">

                                    Active

                                </option>

                                <option value="Inactive">

                                    Inactive

                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>

        </div>
        <!-- ================= Action Buttons ================= -->

        <div class="text-end mt-4 mb-3">

            <button type="button" class="btn btn-secondary me-2" routerLink="/admin/product">

                <i class="fas fa-times me-2"></i>

                Cancel

            </button>

            <button type="submit" class="btn-create">

                <i class="fas fa-save me-2"></i>

                Update Product

            </button>

        </div>

    </form>

</div>
