<div class="container-fluid warehouse-container">

    <div class="warehouse-card">

        <!-- Header -->

        <div class="card-header">

            <h3>Create Warehouse</h3>

            <p>Add a new warehouse to manage raw materials and finished goods</p>

        </div>

        <!-- Form -->

        <form
            [formGroup]="warehouseForm"
            (ngSubmit)="createWarehouse()">

            <div class="row">

                <!-- Warehouse Code -->

                <div class="col-md-6 mb-3">

                    <label>

                        Warehouse Code
                        <span>*</span>

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="warehouseCode"
                        placeholder="Enter Warehouse Code">

                   <small class="text-danger"
  *ngIf="submitted && warehouseForm.controls['warehouseCode'].hasError('required')">
  Warehouse Code is required.
</small>

                </div>

                <!-- Warehouse Name -->

                <div class="col-md-6 mb-3">

                    <label>

                        Warehouse Name
                        <span>*</span>

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="warehouseName"
                        placeholder="Enter Warehouse Name">

                    <small class="text-danger"
  *ngIf="submitted && warehouseForm.controls['warehouseName'].hasError('required')">
  Warehouse Name is required.
</small>

                </div>

                <!-- Warehouse Type -->

                <div class="col-md-6 mb-3">

                    <label>

                        Warehouse Type
                        <span>*</span>

                    </label>

                    <select
                        class="form-select"
                        formControlName="warehouseType">

                        <option value="">Select Warehouse Type</option>

                        <option value="RAW_MATERIAL">

                            Raw Material

                        </option>

                        <option value="FINISHED_GOODS">

                            Finished Goods

                        </option>

                        <option value="BOTH">

                            Both

                        </option>

                    </select>

                    <small
                        class="text-danger"
                        *ngIf="submitted && warehouseForm.controls['warehouseType'].errors">

                        Warehouse Type is required

                    </small>

                </div>

                <!-- Manager -->

                <div class="col-md-6 mb-3">

                    <label>

                        Manager Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="managerName"
                        placeholder="Enter Manager Name">

                </div>

                <!-- Mobile -->

                <div class="col-md-6 mb-3">

                    <label>

                        Mobile Number

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="mobileNumber"
                        placeholder="Enter Mobile Number">

                </div>

                <!-- Email -->

                <div class="col-md-6 mb-3">

                    <label>

                        Email

                    </label>

                    <input
                        type="email"
                        class="form-control"
                        formControlName="email"
                        placeholder="Enter Email">

                </div>

                <!-- Address -->

                <div class="col-md-12 mb-3">

                    <label>

                        Address

                    </label>

                    <textarea
                        rows="3"
                        class="form-control"
                        formControlName="address"
                        placeholder="Enter Address">

                    </textarea>

                </div>

                <!-- City -->

                <div class="col-md-4 mb-3">

                    <label>

                        City

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="city"
                        placeholder="Enter City">

                </div>

                <!-- State -->

                <div class="col-md-4 mb-3">

                    <label>

                        State

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="state"
                        placeholder="Enter State">

                </div>

                <!-- Pincode -->

                <div class="col-md-4 mb-3">

                    <label>

                        Pincode

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="pincode"
                        placeholder="Enter Pincode">

                </div>

                <!-- Status -->

                <div class="col-md-6 mb-4">

                    <label>

                        Status

                    </label>

                    <select
                        class="form-select"
                        formControlName="isActive">

                        <option [ngValue]="true">

                            Active

                        </option>

                        <option [ngValue]="false">

                            Inactive

                        </option>

                    </select>

                </div>

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <button
                    type="button"
                    class="btn btn-secondary"
                    routerLink="/admin/warehouse-list">

                    <i class="fa fa-arrow-left me-2"></i>

                    Back

                </button>

               
<button
  type="submit"
  class="btn btn-save"
  [disabled]="isSubmitting">

  <span
    *ngIf="isSubmitting"
    class="spinner-border spinner-border-sm me-2"
    role="status"
    aria-hidden="true">
  </span>

  <i *ngIf="!isSubmitting" class="fa fa-save me-2"></i>

  {{ isSubmitting ? 'Saving...' : 'Save Warehouse' }}

</button>


            </div>
            
        </form>

    </div>

</div>
