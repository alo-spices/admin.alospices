<div class="container-fluid warehouse-container">

    <div class="warehouse-wrapper">

        <!-- Header -->

        <div class="page-header">

            <h2>

                Update Warehouse

            </h2>

            <p>

                Update warehouse information

            </p>

        </div>

        <!-- Card -->

        <div class="warehouse-card">

            <form
                [formGroup]="warehouseForm"
                (ngSubmit)="updateWarehouse()">

                <div class="row">

                    <!-- Warehouse Code -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            Warehouse Code

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="warehouseCode"
                            readonly>

                    </div>

                    <!-- Warehouse Name -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            Warehouse Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="warehouseName"
                            placeholder="Enter Warehouse Name">

                    </div>

                    <!-- Warehouse Type -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            Warehouse Type

                        </label>

                        <select
                            class="form-select"
                            formControlName="warehouseType">

                            <option value="">

                                Select Type

                            </option>

                            <option value="RAW_MATERIAL">

                                Raw Material

                            </option>

                            <option value="FINISHED_GOODS">

                                Finished Goods

                            </option>

                            <option value="BOTH">

                                Both

                            </option>

                        </select>

                    </div>

                    <!-- Manager -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            Manager Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="managerName"
                            placeholder="Enter Manager Name">

                    </div>

                    <!-- Mobile -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            Mobile Number

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="mobileNumber"
                            placeholder="Enter Mobile Number">

                    </div>

                    <!-- Email -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            formControlName="email"
                            placeholder="Enter Email">

                    </div>

                    <!-- City -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            City

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="city"
                            placeholder="Enter City">

                    </div>

                    <!-- State -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            State

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="state"
                            placeholder="Enter State">

                    </div>

                    <!-- Pincode -->

                    <div class="col-lg-4 col-md-6 mb-4">

                        <label class="form-label">

                            Pincode

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="pincode"
                            placeholder="Enter Pincode">

                    </div>

                    <!-- Address -->

                    <div class="col-12 mb-4">

                        <label class="form-label">

                            Address

                        </label>

                        <textarea
                            rows="4"
                            class="form-control"
                            formControlName="address"
                            placeholder="Enter Address">

                        </textarea>

                    </div>

                    <!-- Status -->

                    <div class="col-md-4 mb-4">

                        <label class="form-label">

                            Status

                        </label>

                        <select
                            class="form-select"
                            formControlName="isActive">

                            <option [ngValue]="true">

                                Active

                            </option>

                            <option [ngValue]="false">

                                Inactive

                            </option>

                        </select>

                    </div>

                </div>

                <!-- Buttons -->

                <div class="button-section">

                    <button
                        type="submit"
                        class="btn btn-save">

                        <i class="fa fa-save me-2"></i>

                        Update Warehouse

                    </button>

                    <button
                        type="button"
                        class="btn btn-back"
                        (click)="goBack()">

                        <i class="fa fa-arrow-left me-2"></i>

                        Back

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
