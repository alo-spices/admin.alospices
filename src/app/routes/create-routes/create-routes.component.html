<div class="category-container">

    <div class="container">

        <div class="row">


            <!-- ========================================== -->
            <!-- Title -->
            <!-- ========================================== -->

            <div class="col-md-12">

                <div class="title-section">

                    <h2>
                        Create Route
                    </h2>

                    <p>
                        Create a new sales route and assign an area
                    </p>

                </div>

            </div>


            <!-- ========================================== -->
            <!-- Form Card -->
            <!-- ========================================== -->

            <div class="col-md-12">

                <div class="category-card">

                    <form [formGroup]="routeForm" (ngSubmit)="onSubmit()">


                        <div class="category-grid">


                            <!-- ====================================== -->
                            <!-- Form Area -->
                            <!-- ====================================== -->

                            <div class="form-area">


                                <!-- ================================= -->
                                <!-- ROUTE INFORMATION -->
                                <!-- ================================= -->

                                <div class="section-title full-width">

                                    <h4>
                                        Route Information
                                    </h4>

                                </div>


                                <!-- Route Name -->
                                <!-- ================================= -->
                                <!-- Area -->
                                <!-- ================================= -->

                                <div class="form-group">

                                    <label>

                                        Area

                                        <span class="required">
                                            *
                                        </span>

                                    </label>


                                    <select formControlName="area">

                                        <option value="">
                                            Select Area
                                        </option>


                                        <option *ngFor="
                                                        let area
                                                        of areaList
                                                    " [value]="area._id">

                                            {{
                                            area.areaName
                                            }}

                                            -

                                            {{
                                            area.areaCode
                                            }}

                                        </option>

                                    </select>
                                    <div class="text-danger"
     *ngIf="routeForm.get('area')?.touched && routeForm.get('area')?.hasError('required')">
  Area is required.
</div>

                                </div>
                                <div class="form-group">

                                    <label>

                                        Route Name

                                        <span class="required">
                                            *
                                        </span>

                                    </label>


                                    <input type="text" formControlName="routeName" placeholder="Enter route name">
                                    <div class="text-danger"
     *ngIf="routeForm.get('routeName')?.touched && routeForm.get('routeName')?.hasError('required')">
  Route name is required.
</div>

                                </div>


                                <!-- Route Code -->

                                <div class="form-group">

                                    <label>

                                        Route Code

                                        <span class="required">
                                            *
                                        </span>

                                    </label>


                                    <input type="text" formControlName="routeCode" placeholder="Enter route code">
                                    <div class="text-danger"
     *ngIf="routeForm.get('routeCode')?.touched && routeForm.get('routeCode')?.hasError('required')">
  Route code is required.
</div>

                                </div>





                                <!-- ================================= -->
                                <!-- Monthly Sales Target -->
                                <!-- ================================= -->

                                <!-- <div class="form-group">

                                    <label>

                                        Monthly Sales Target

                                    </label>


                                    <input type="number" formControlName="monthlySalesTarget" min="0"
                                        placeholder="Enter sales target">

                                </div> -->


                                <!-- ================================= -->
                                <!-- Monthly Collection Target -->
                                <!-- ================================= -->

                                <!-- <div class="form-group">

                                    <label>

                                        Monthly Collection Target

                                    </label>


                                    <input type="number" formControlName="monthlyCollectionTarget" min="0"
                                        placeholder="Enter collection target">

                                </div> -->


                                <!-- ================================= -->
                                <!-- Description -->
                                <!-- ================================= -->

                                <div class="form-group full-width">

                                    <label>
                                        Description
                                    </label>


                                    <textarea rows="4" formControlName="description"
                                        placeholder="Enter route description">
                                    </textarea>

                                </div>


                            </div>


                            <!-- ====================================== -->
                            <!-- Preview Area -->
                            <!-- ====================================== -->

                            <div class="preview-area">


                                <!-- ================================= -->
                                <!-- Route Preview -->
                                <!-- ================================= -->

                                <!-- <div class="route-preview-card">

                                    <div class="route-icon">

                                        <i class="fa fa-route"></i>

                                    </div>


                                    <h4>
                                        Route Preview
                                    </h4>



                                    <div class="preview-info">

                                        <span>
                                            Route Name
                                        </span>

                                        <strong>

                                            {{
                                            routeForm.get(
                                            'routeName'
                                            )?.value
                                            || '-'
                                            }}

                                        </strong>

                                    </div>



                                    <div class="preview-info">

                                        <span>
                                            Route Code
                                        </span>

                                        <strong>

                                            {{
                                            routeForm.get(
                                            'routeCode'
                                            )?.value
                                            || '-'
                                            }}

                                        </strong>

                                    </div>



                                    <div class="preview-info">

                                        <span>
                                            Area
                                        </span>

                                        <strong>

                                            {{
                                            getSelectedAreaName()
                                            || '-'
                                            }}

                                        </strong>

                                    </div>



                                    <div class="preview-info">

                                        <span>
                                            Monthly Sales Target
                                        </span>

                                        <strong>

                                            ₹
                                            {{
                                            routeForm.get(
                                            'monthlySalesTarget'
                                            )?.value
                                            || 0
                                            }}

                                        </strong>

                                    </div>



                                    <div class="preview-info">

                                        <span>
                                            Monthly Collection Target
                                        </span>

                                        <strong>

                                            ₹
                                            {{
                                            routeForm.get(
                                            'monthlyCollectionTarget'
                                            )?.value
                                            || 0
                                            }}

                                        </strong>

                                    </div>

                                </div> -->


                                <!-- ================================= -->
                                <!-- Information -->
                                <!-- ================================= -->

                                <div class="role-info">

                                    <span>
                                        Route Management
                                    </span>

                                    <strong>
                                        Sales Route
                                    </strong>

                                    <small>

                                        This route can later be assigned
                                        to Sales Managers, Salesmen and
                                        Distributors.

                                    </small>

                                </div>

                            </div>


                        </div>


                        <!-- ====================================== -->
                        <!-- Buttons -->
                        <!-- ====================================== -->

                        <div class="button-group">


                            <button type="submit" class="btn-create" [disabled]="isLoading">

                                <span *ngIf="!isLoading">

                                    <i class="fa fa-save me-2"></i>

                                    Save Route

                                </span>


                                <span *ngIf="isLoading">

                                    <i class="fa fa-spinner fa-spin me-2">
                                    </i>

                                    Creating...

                                </span>

                            </button>


                            <button type="button" class="btn-back" (click)="goBack()">

                                <i class="fa fa-arrow-left me-2"></i>

                                Back

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
